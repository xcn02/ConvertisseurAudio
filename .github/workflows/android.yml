name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

- name: Set up Android SDK
  uses: android-actions/setup-android@v3

- name: Install SDK and native tools
  run: |
    sdkmanager "platforms;android-35" \
      "build-tools;35.0.0" \
      "ndk;28.2.13676358" \
      "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signed

          "$BUILD_TOOLS/zipalign" -P 16 -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            signed/aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out signed/Convertisseur-release.apk \
            signed/aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose \
            signed/Convertisseur-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Convertisseur-release-${{ github.run_number }}
          path: signed/Convertisseur-release.apk

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
